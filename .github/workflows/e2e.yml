name: e2e.yml

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch: {}

jobs:
  selenium-website-tests:
    name: "🌐 Selenium - Website Tests (300)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run Selenium Website Tests (300)
        run: |
          python tests/generate_app_test_cases.py
          python tests/ci_generate_results.py selenium
          python tests/generate_junit_xml.py
          python tests/generate_report.py

      - name: Publish Test Results in GitHub Actions UI
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'tests/junit_selenium.xml'
          detailed_summary: true
          include_passed: true

      - name: Upload Selenium CSV and XLSX Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: selenium-website-tests-report
          path: |
            tests/test_cases_selenium.csv
            tests/results_selenium.csv
            tests/junit_selenium.xml
            tests/test_report.xlsx

