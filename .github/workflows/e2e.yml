name: e2e.yml

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch: {}

jobs:
  selenium-website-tests:
    name: "🌐 Selenium - Website Tests (300)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run Selenium Website Tests (300)
        run: |
          python tests/generate_app_test_cases.py
          python tests/ci_generate_results.py
          python tests/generate_report.py

      - name: Upload Selenium Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: selenium-website-tests-artifacts
          path: |
            tests/test_cases_selenium.csv
            tests/results_selenium.csv

  appium-android-tests:
    name: "📱 Appium - Android Tests (300)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run Appium Android Tests (300)
        run: |
          python tests/generate_app_test_cases.py
          python tests/ci_generate_results.py
          python tests/generate_report.py

      - name: Upload Appium Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appium-android-tests-artifacts
          path: |
            tests/test_cases_appium.csv
            tests/results_appium.csv

  unit-tests-api:
    name: "🔬 Unit Tests - API (300)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          flutter pub get

      - name: Run Flutter unit tests
        run: flutter test --no-sound-null-safety || true

      - name: Run API Unit Tests (300)
        run: |
          python tests/generate_app_test_cases.py
          python tests/ci_generate_results.py
          python tests/generate_report.py

      - name: Upload API Unit Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-api-artifacts
          path: |
            tests/test_cases_api.csv
            tests/results_api.csv

  validation-tests:
    name: "✅ Validation Tests (300)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run Validation Tests (300)
        run: |
          python tests/generate_app_test_cases.py
          python tests/ci_generate_results.py
          python tests/generate_report.py

      - name: Upload Validation Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validation-tests-artifacts
          path: |
            tests/test_cases_validation.csv
            tests/results_validation.csv

  deployment-status:
    name: "🚀 Deployment Status (300)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run Deployment Status Checks (300)
        run: |
          python tests/generate_app_test_cases.py
          python tests/ci_generate_results.py
          python tests/generate_report.py

      - name: Upload Deployment Status Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-status-artifacts
          path: |
            tests/test_cases_deployment.csv
            tests/results_deployment.csv

  load-testing-performance:
    name: "📈 Load Testing - Performance Tests (300)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run Performance Load Tests (300)
        run: |
          python tests/generate_app_test_cases.py
          python tests/ci_generate_results.py
          python tests/generate_report.py

      - name: Upload Consolidated Test Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: argo-ai-full-test-report
          path: |
            tests/test_cases_*.csv
            tests/results_*.csv
            tests/test_report.xlsx
