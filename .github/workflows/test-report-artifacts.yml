name: Generate Test Cases and Artifacts

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch: {}

jobs:
  generate-test-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Generate test cases
        run: python tests/generate_app_test_cases.py

      - name: Generate CI result files
        run: python tests/ci_generate_results.py

      - name: Generate combined report
        run: python tests/generate_report.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: argo-ai-test-artifacts
          path: |
            tests/test_cases_*.csv
            tests/results_*.csv
            tests/test_report.xlsx
